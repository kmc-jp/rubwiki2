name: Main

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.332.0
        with:
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec
